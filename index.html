<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="英単語練習">
  <title>英単語タイピング練習</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>英単語タイピング練習</h1>
    <p id="status">準備中…</p>
  </header>

  <main>
    <nav class="tabs" aria-label="画面切替">
      <button class="tab active" data-screen="quiz">学習</button>
      <button class="tab" data-screen="add">単語登録</button>
      <button class="tab" data-screen="list">単語一覧</button>
      <button class="tab" data-screen="backup">バックアップ</button>
    </nav>

    <section id="quiz" class="screen active">
      <div class="card">
        <div class="progress" id="progress">登録単語 0件</div>
        <div class="priority-badge hidden" id="priorityBadge"></div>
        <h2 id="question">まず「単語登録」からカードを追加してください</h2>

        <div class="quick-answer">
          <p class="quick-title">急いでいるときは自己申告</p>
          <div class="quick-buttons">
            <button id="knowBtn" class="know-btn">✓ わかる</button>
            <button id="dontKnowBtn" class="dontknow-btn">✕ わからない</button>
          </div>
        </div>

        <div class="divider"><span>または英語を入力</span></div>
        <label for="answer">英語を入力</label>
        <input id="answer" type="text" autocomplete="off" autocapitalize="none"
               spellcheck="false" placeholder="英語を入力">
        <button id="checkBtn" class="primary">入力した答えを判定</button>

        <div id="result" class="result hidden" aria-live="polite">
          <h3 id="judgement"></h3>
          <p>正解：<strong id="correctAnswer"></strong></p>
          <p id="yourAnswerRow">あなたの回答：<span id="yourAnswer"></span></p>
          <p id="answerMode" class="stats-line"></p>
          <p id="resultStats" class="stats-line"></p>
          <img id="answerImage" class="answer-image hidden" alt="登録したイメージ画像">
          <p id="example" class="example"></p>
          <div class="button-row">
            <button id="speakBtn">🔊 もう一度聞く</button>
            <button id="nextBtn" class="primary">次の問題</button>
          </div>
        </div>
      </div>
    </section>

    <section id="add" class="screen">
      <form id="addForm" class="card">
        <h2>新しい単語を登録</h2>
        <label for="japanese">日本語</label>
        <input id="japanese" required placeholder="例：障害を克服する">

        <label for="english">正解の英語</label>
        <input id="english" required autocapitalize="none" spellcheck="false"
               placeholder="例：overcome an obstacle">

        <label for="exampleInput">例文・補足（任意）</label>
        <textarea id="exampleInput" rows="3"
                  placeholder="例：She overcame every obstacle."></textarea>

        <label for="imageInput">答えと一緒に表示する画像（任意）</label>
        <input id="imageInput" type="file" accept="image/*">
        <p class="note">画像はiPhone内に保存します。容量節約のため自動的に縮小します。</p>

        <button class="primary" type="submit">登録する</button>
      </form>
    </section>

    <section id="list" class="screen">
      <div class="card">
        <div class="list-head">
          <div><h2>登録済み単語</h2><p id="overallStats" class="note"></p></div>
          <button id="deleteAllBtn" class="danger">全削除</button>
        </div>
        <div class="sort-row">
          <label for="sortSelect">並び順</label>
          <select id="sortSelect">
            <option value="weak">苦手順</option>
            <option value="new">新しい順</option>
            <option value="accuracy">正答率が低い順</option>
            <option value="attempts">回答回数が多い順</option>
          </select>
        </div>
        <div id="wordList"></div>
      </div>
    </section>

    <section id="backup" class="screen">
      <div class="card">
        <h2>バックアップ</h2>
        <p>端末の故障やSafariデータ削除に備え、定期的に保存してください。</p>
        <button id="exportBtn" class="primary">バックアップを書き出す</button>

        <label for="importInput" class="import-label">バックアップを読み込む</label>
        <input id="importInput" type="file" accept=".json,application/json">
        <p class="note">読み込むと、同じIDのカードは上書きされます。</p>
      </div>
    </section>
  </main>

  <div id="editModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>単語を修正</h2>
        <button id="closeEditBtn" class="icon-btn">×</button>
      </div>
      <form id="editForm">
        <input id="editId" type="hidden">
        <label for="editJapanese">日本語</label>
        <input id="editJapanese" required>
        <label for="editEnglish">正解の英語</label>
        <input id="editEnglish" required autocapitalize="none" spellcheck="false">
        <label for="editExample">例文・補足</label>
        <textarea id="editExample" rows="3"></textarea>
        <div id="currentImageWrap" class="current-image-wrap hidden">
          <p class="note">現在の画像</p>
          <img id="currentEditImage" class="edit-image" alt="現在の登録画像">
          <label class="checkbox-label"><input id="removeImageCheck" type="checkbox"> 現在の画像を削除する</label>
        </div>
        <label for="editImageInput">画像を変更（任意）</label>
        <input id="editImageInput" type="file" accept="image/*">
        <p class="note">新しい画像を選ぶと現在の画像と置き換わります。</p>
        <div class="button-row">
          <button id="cancelEditBtn" type="button">キャンセル</button>
          <button type="submit" class="primary">変更を保存</button>
        </div>
      </form>
    </div>
  </div>

  <footer>
    <p>データはこの端末内に保存されます。</p>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
